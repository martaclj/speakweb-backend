spring.application.name=speakweb-backend
server.port=8080

spring.config.import=optional:application-local.properties

# conexión a Mysql local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/speakweb_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# no genera schema auto - usamos speakweb_db.sql
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true 
spring.jpa.hibernate.ddl-auto=none

# JWT Configuration
jwt.secret=${JWT_SECRET}

# logs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Ajustes para Swagger: orden alfabético
springdoc.swagger-ui.tags-sorter=alpha

# límite de subida de archivos: 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
